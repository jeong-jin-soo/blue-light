<!doctype html>
<html lang="en">

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1b2a4a" />

    <link rel="icon" type="image/png" href="/licensekaki-logo.png" />

      "serviceType": [
        "Electrical installation licence application",
        "Electrical installation licence renewal",
        "Single Line Diagram (SLD)",
        "Licensed Electrical Worker (LEW) services"
      ]
    }

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LicenseKaki",
      "url": "https://licensekaki.com/"
    }
