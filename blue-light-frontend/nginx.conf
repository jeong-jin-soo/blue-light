# ── 색인 정책: 앱/인증 경로는 noindex 헤더로 제외 ──
# robots.txt Disallow 만으로는 색인을 막지 못한다(크롤만 막음). 오히려 외부 링크로 발견되면
# 제목·설명 없이 색인되어 Search Console "색인이 생성되었으나 robots.txt 에 의해 차단됨" 이 뜬다.
# → robots.txt 는 열어두고(크롤 허용), 여기서 noindex 를 내려 Google 이 실제로 읽고 제외하게 한다.
# $uri 는 try_files 폴백 후 /index.html 로 바뀌므로 반드시 $request_uri(원본)로 판정한다.
map $request_uri $robots_tag {
    default "";
    "~^/(login|signup|forgot-password|reset-password|verify-email|email-verification-pending|account-setup|setup-account|lew-pending|dashboard|profile|notifications|applications|sld-orders|lighting-orders|power-socket-orders|lew-service-orders|expired-license-orders|admin|lew|sld-manager|lighting-manager|power-socket-manager|lew-service-manager|expired-license-manager|concierge)(/|\?|$)" "noindex, follow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 본문 크기 한도 — 백엔드 Spring multipart(max-request-size 30MB)와 정합.
    # 미설정 시 nginx 기본 1MB라 1MB 초과 파일 업로드(LoA 최종본 등)가 백엔드 도달 전
    # 413으로 차단되어 "계속 pending"으로 보였다. /api 프록시 업로드를 위해 server 레벨로 상향.
    client_max_body_size 30m;

    # ── 보안 헤더 (오픈 체크리스트 P0-3) ──
    # TLS는 ALB 종료 — HSTS는 브라우저 기준 https 응답에 적용된다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 값이 비면 nginx 가 헤더 자체를 생략한다 — 공개 마케팅 페이지는 그대로 색인.
    add_header X-Robots-Tag $robots_tag always;
    # CSP: 전 리소스 셀프호스팅(외부 CDN/폰트 없음). blob: 은 파일 미리보기 iframe·이미지용.
    # style 'unsafe-inline'은 React inline style + 이메일 템플릿 srcdoc 미리보기용.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ALB → Nginx: 실제 클라이언트 IP 복원 (VPC 내부 CIDR)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ALB 헬스체크 (백엔드 의존 없이 빠른 응답)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 정적 파일 캐싱 (해시된 파일명)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header가 있는 location은 server 레벨 헤더를 상속하지 않음 — 재선언
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API 프록시 → 백엔드
    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 지원 — AI 챗봇 스트리밍
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 라우팅 — 라우트별 정적 head(scripts/prerender-head.mjs 생성분)가 있으면 그것을,
    # 없으면 홈 index.html 로 폴백. `$uri/` 대신 `$uri/index.html` 을 쓰는 이유는
    # 디렉터리 매칭 시 nginx 가 트레일링 슬래시 301 을 내보내지 않게 하기 위함
    # (301 이 생기면 Search Console 에 "페이지에 리디렉션이 포함됨" 으로 잡힌다).
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
