server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ── 보안 헤더 (오픈 체크리스트 P0-3) ──
    # TLS는 ALB 종료 — HSTS는 브라우저 기준 https 응답에 적용된다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 전 리소스 셀프호스팅(외부 CDN/폰트 없음). blob: 은 파일 미리보기 iframe·이미지용.
    # style 'unsafe-inline'은 React inline style + 이메일 템플릿 srcdoc 미리보기용.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ALB → Nginx: 실제 클라이언트 IP 복원 (VPC 내부 CIDR)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ALB 헬스체크 (백엔드 의존 없이 빠른 응답)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 정적 파일 캐싱 (해시된 파일명)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header가 있는 location은 server 레벨 헤더를 상속하지 않음 — 재선언
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API 프록시 → 백엔드
    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 지원 — AI 챗봇 스트리밍
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA 라우팅 — 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
