name: Deploy to Development (DigitalOcean)

# 초안 — .github/workflows/deploy-dev.yml 대체용. 단일 Droplet.
on:
  push:
    branches: [develop]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}   # registry.digitalocean.com/<registry>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: blue-light-backend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('blue-light-backend/**/*.gradle*', 'blue-light-backend/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: ./gradlew build --no-daemon -x test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: blue-light-frontend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blue-light-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env: { VITE_API_BASE_URL: /api }

  docker-push:
    name: Push Docker Images → DOCR
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: development
    steps:
      - uses: actions/checkout@v5
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200
      - name: Build & Push Backend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-backend:latest ./blue-light-backend
          docker push $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-backend:latest
      - name: Build & Push Frontend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-frontend:latest \
                       --build-arg VITE_API_BASE_URL=/api ./blue-light-frontend
          docker push $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-frontend:latest
      - name: Build & Push SLD Agent
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-sld-agent:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-sld-agent:latest \
                       --build-arg GIT_COMMIT=$(echo $IMAGE_TAG | cut -c1-7) \
                       --build-arg GIT_BRANCH=${{ github.ref_name }} ./blue-light-ai
          docker push $DOCKER_REGISTRY/bluelight-sld-agent:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-sld-agent:latest

  deploy:
    name: Deploy to Dev Droplet
    runs-on: ubuntu-latest
    needs: docker-push
    environment: development
    steps:
      - uses: actions/checkout@v5
      - name: Copy compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "deploy/digitalocean/docker-compose.do.yml"
          target: "/root/bluelight"
          strip_components: 2     # → docker-compose.do.yml 만 배치
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/bluelight
            mv -f docker-compose.do.yml docker-compose.yml

            echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com \
              -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin

            cat > .env << 'ENVEOF'
            DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
            IMAGE_TAG=${{ github.sha }}
            SPRING_PROFILES_ACTIVE=default
            SQL_INIT_MODE=never
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FILE_ENCRYPTION_KEY=${{ secrets.FILE_ENCRYPTION_KEY }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            PASSWORD_RESET_BASE_URL=${{ secrets.PASSWORD_RESET_BASE_URL }}
            FILE_STORAGE_TYPE=s3
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_S3_REGION=sgp1
            AWS_S3_ENDPOINT=https://sgp1.digitaloceanspaces.com
            AWS_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_ACCESS_KEY }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
            MAIL_SMTP_ENABLED=true
            SLD_AGENT_SERVICE_KEY=${{ secrets.SLD_AGENT_SERVICE_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF

            DB_URL_RAW=$(grep '^DB_URL=' .env | sed 's/^DB_URL=//')
            echo "MYSQL_HOST=$(echo "$DB_URL_RAW" | sed 's|jdbc:mysql://||' | cut -d: -f1)" >> .env
            echo "MYSQL_PORT=$(echo "$DB_URL_RAW" | sed 's|jdbc:mysql://||' | cut -d: -f2 | cut -d/ -f1)" >> .env
            echo "MYSQL_DATABASE=$(echo "$DB_URL_RAW" | sed 's|jdbc:mysql://||' | cut -d/ -f2 | cut -d? -f1)" >> .env

            docker image prune -a -f --filter "until=24h" || true
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f
