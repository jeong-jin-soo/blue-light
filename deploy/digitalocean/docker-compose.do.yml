# ============================================
# DigitalOcean 올인원 단일 드롭릿 compose (비용축소 통합, 2026-07)
#   - MySQL 셀프호스트 컨테이너(Managed MySQL 대체)
#   - Caddy가 443 TLS 종단(Let's Encrypt) → frontend:80 (DO LB 대체)
#   - sld-agent 제거(WhatsApp 퍼스트 전환으로 SLD 자가생성 미사용)
#   - 파일저장은 DO Spaces 유지(FILE_STORAGE_TYPE=s3)
# DNS: licensekaki.com / www → 이 드롭릿 IP
# ============================================

services:
  mysql:
    image: mysql:8.4
    container_name: bluelight-mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bluelight
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Singapore
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 640M

  backend:
    image: ${DOCKER_REGISTRY}/bluelight-backend:${IMAGE_TAG:-latest}
    container_name: bluelight-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      # DB → 로컬 MySQL 컨테이너 (SSL 불필요)
      SPRING_DATASOURCE_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # File Storage → DO Spaces (S3 호환)
      FILE_UPLOAD_DIR: /app/uploads
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-s3}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-sgp1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Email (Resend SMTP)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@licensekaki.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-LicenseKaki}
      MAIL_SMTP_ENABLED: ${MAIL_SMTP_ENABLED:-false}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-https://licensekaki.com}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    image: ${DOCKER_REGISTRY}/bluelight-frontend:${IMAGE_TAG:-latest}
    container_name: bluelight-frontend
    restart: always
    # 호스트 포트 미노출 — Caddy가 리버스 프록시로 접근
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  caddy:
    image: caddy:2
    container_name: bluelight-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddyfile의 {$SITE_ADDRESS} 치환 — 환경별 도메인 주입
      SITE_ADDRESS: ${SITE_ADDRESS:-licensekaki.com, www.licensekaki.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
