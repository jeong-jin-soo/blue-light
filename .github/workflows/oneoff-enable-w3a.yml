name: One-off - Enable PR-W3a templates

# 일회성: PR-W3a 배선 대상 컨시어지 템플릿 활성화. 실행 후 제거.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-enable-w3a.yml'

jobs:
  enable:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Enable A-31/A-33/A-36/C-01/M-03
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -N -e "
                UPDATE notification_templates SET enabled = TRUE
                WHERE template_code IN ('A-31','A-33','A-36','C-01','M-03');
                SELECT CONCAT('enabled rows: ', template_code, '/', channel) FROM notification_templates
                WHERE enabled = TRUE ORDER BY template_code, channel;
              "
