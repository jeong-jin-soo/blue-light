name: One-off - Seed prod templates

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-verify-prod-schema.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Cross-DB seed bluelight -> bluelight_prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e "
                INSERT INTO bluelight_prod.notification_catalog
                  (template_code, allowed_variables_json, default_category, default_severity,
                   default_recipient_roles, description, required_tokens_json, created_at, updated_at)
                SELECT template_code, allowed_variables_json, default_category, default_severity,
                   default_recipient_roles, description, required_tokens_json, NOW(6), NOW(6)
                FROM bluelight.notification_catalog
                ON DUPLICATE KEY UPDATE allowed_variables_json=VALUES(allowed_variables_json),
                   default_category=VALUES(default_category), default_severity=VALUES(default_severity),
                   default_recipient_roles=VALUES(default_recipient_roles), description=VALUES(description),
                   required_tokens_json=VALUES(required_tokens_json), updated_at=NOW(6);
                INSERT INTO bluelight_prod.notification_templates
                  (template_code, channel, locale, provider_template_name, subject, body_text,
                   variables_json, enabled, version, catalog_meta_key, category, severity,
                   recipient_roles, created_at, updated_at)
                SELECT template_code, channel, locale, provider_template_name, subject, body_text,
                   variables_json, enabled, version, catalog_meta_key, category, severity,
                   recipient_roles, NOW(6), NOW(6)
                FROM bluelight.notification_templates
                ON DUPLICATE KEY UPDATE subject=VALUES(subject), body_text=VALUES(body_text),
                   variables_json=VALUES(variables_json), enabled=VALUES(enabled),
                   category=VALUES(category), severity=VALUES(severity),
                   recipient_roles=VALUES(recipient_roles), catalog_meta_key=VALUES(catalog_meta_key), updated_at=NOW(6);
                SELECT CONCAT('prod_catalog_rows=', (SELECT COUNT(*) FROM bluelight_prod.notification_catalog));
                SELECT CONCAT('prod_template_rows=', (SELECT COUNT(*) FROM bluelight_prod.notification_templates));
                SELECT CONCAT('prod_enabled=', (SELECT COUNT(*) FROM bluelight_prod.notification_templates WHERE enabled=1));
                SELECT CONCAT('prod_enabled_codes=', (SELECT GROUP_CONCAT(DISTINCT template_code) FROM bluelight_prod.notification_templates WHERE enabled=1));
                SELECT CONCAT('prod_mojibake=', (SELECT COUNT(*) FROM bluelight_prod.notification_templates WHERE body_text LIKE '%â€%' OR body_text LIKE '%{{specialist%'));
              "
