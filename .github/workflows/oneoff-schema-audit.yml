name: One-off - Gen prod ALTER

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-schema-audit.yml'

jobs:
  gen:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Generate ALTER statements from dev defs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e "
                SELECT CONCAT('ALTER TABLE ', table_name, ' ADD COLUMN \`', column_name, '\` ', column_type,
                  IF(is_nullable='NO',' NOT NULL',' NULL'),
                  IF(column_default IS NULL, '',
                     CONCAT(' DEFAULT ',
                       CASE WHEN column_default IN ('CURRENT_TIMESTAMP','NULL') OR column_type RLIKE '^(int|bigint|tinyint|decimal|double|float|bit)'
                            THEN column_default ELSE CONCAT(CHAR(39), column_default, CHAR(39)) END)),
                  ';') AS stmt
                FROM information_schema.columns
                WHERE table_schema='bluelight'
                  AND ( (table_name='users' AND column_name IN ('phone_e164','phone_verified','phone_verified_at','whatsapp_opt_in','whatsapp_opt_in_at','whatsapp_opt_out_at','preferred_language'))
                     OR (table_name='applications' AND column_name IN ('applicant_name_snapshot','company_name_snapshot','uen_snapshot','designation_snapshot','snapshot_backfilled_at','applicant_type','kva_status','kva_source','kva_confirmed_by','kva_confirmed_at','version')) )
                ORDER BY table_name, ordinal_position;"
