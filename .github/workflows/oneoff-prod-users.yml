name: One-off - Prod table inventory

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-prod-users.yml'

jobs:
  inv:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Row counts per table (bluelight_prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            DB=bluelight_prod
            echo "=== 테이블별 정확 row 수 (비어있지 않은 것 위주로 전수) ==="
            TABLES=$(docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='$DB' AND table_type='BASE TABLE' ORDER BY table_name;")
            for t in $TABLES; do
              c=$(docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
                mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e "SELECT COUNT(*) FROM \`$DB\`.\`$t\`;" 2>/dev/null)
              echo "$c | $t"
            done
