name: One-off - List prod users

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-prod-users.yml'

jobs:
  list:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: List bluelight_prod users
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            echo "=== bluelight_prod.users 전체 (deleted 포함) ==="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(user_seq,' | ',email,' | ',role,' | status=',IFNULL(status,'-'),' | deleted_at=',IFNULL(deleted_at,'NULL')) FROM bluelight_prod.users ORDER BY user_seq;"
            echo "=== 합계 (전체 / 미삭제) ==="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT('total=', COUNT(*), ' active(not deleted)=', SUM(deleted_at IS NULL)) FROM bluelight_prod.users;"
