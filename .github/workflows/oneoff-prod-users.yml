name: One-off - Prod table inventory

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-prod-users.yml'

jobs:
  inv:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Table list + approx rows (single query)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            echo "=== bluelight_prod 전 테이블 + 대략 row수 (table_rows desc) ==="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(LPAD(IFNULL(table_rows,0),7,' '), '  ', table_name)
               FROM information_schema.tables
               WHERE table_schema='bluelight_prod' AND table_type='BASE TABLE'
               ORDER BY table_rows DESC, table_name;"
            echo "=== 핵심 거래 테이블 정확 count (한 번에) ==="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e "
                SELECT CONCAT('applications=', (SELECT COUNT(*) FROM bluelight_prod.applications));
                SELECT CONCAT('payments=', (SELECT COUNT(*) FROM bluelight_prod.payments));
                SELECT CONCAT('files=', (SELECT COUNT(*) FROM bluelight_prod.files));
                SELECT CONCAT('notifications=', (SELECT COUNT(*) FROM bluelight_prod.notifications));
              "
