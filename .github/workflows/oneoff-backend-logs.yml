name: One-off - Dump backend logs

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-backend-logs.yml'

jobs:
  dump-logs:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Tail backend logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            echo "===== docker ps ====="
            docker compose -f docker-compose.yml ps 2>&1 | head -20
            echo "===== backend logs: notification-templates / Exception context (last 400) ====="
            docker compose -f docker-compose.yml logs --tail=400 backend 2>&1 \
              | grep -iE "notification-template|NotificationTemplate|Exception|ERROR|Caused by|at com.bluelight|nested exception|SQL|JdbcSQL|could not|Servlet" \
              | tail -90 || echo "(no matching lines)"
