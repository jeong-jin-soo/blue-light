name: One-off - Sync settings dev to prod

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-sync-settings.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Sync settings/prices/doctypes dev -> prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -u "$DB_USERNAME" -e "
                -- 1) system_settings: dev 값으로 upsert (QR 파일 경로 2종 제외 — prod 스토리지 보존)
                INSERT INTO bluelight_prod.system_settings (setting_key, setting_value, description, updated_at)
                SELECT setting_key, setting_value, description, NOW(6) FROM bluelight.system_settings
                WHERE setting_key NOT IN ('payment_paynow_qr','invoice_paynow_qr_file_seq')
                ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value), description=VALUES(description), updated_at=NOW(6);

                -- 2) master_prices: prod 전체 교체 (apps=0 이라 FK 안전)
                DELETE FROM bluelight_prod.master_prices;
                INSERT INTO bluelight_prod.master_prices SELECT * FROM bluelight.master_prices;

                -- 3) document_type_catalog: prod 비어있음 → dev 복사
                INSERT INTO bluelight_prod.document_type_catalog SELECT * FROM bluelight.document_type_catalog;

                -- 검증
                SELECT CONCAT('prod paynow_uen=', (SELECT setting_value FROM bluelight_prod.system_settings WHERE setting_key='payment_paynow_uen'));
                SELECT CONCAT('prod paynow_name=', (SELECT setting_value FROM bluelight_prod.system_settings WHERE setting_key='payment_paynow_name'));
                SELECT CONCAT('prod paynow_qr(보존)=', (SELECT setting_value FROM bluelight_prod.system_settings WHERE setting_key='payment_paynow_qr'));
                SELECT CONCAT('prod master_prices_rows=', (SELECT COUNT(*) FROM bluelight_prod.master_prices), ' first=', (SELECT description FROM bluelight_prod.master_prices ORDER BY kva_min LIMIT 1));
                SELECT CONCAT('prod doc_type_catalog=', (SELECT COUNT(*) FROM bluelight_prod.document_type_catalog));
              "
