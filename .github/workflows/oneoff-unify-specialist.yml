name: One-off - Unify manager to specialist

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-unify-specialist.yml'

jobs:
  find:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Extract broken token
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -t -e "
                SELECT template_code, channel,
                  SUBSTRING(body_text, GREATEST(LOCATE('{{specialist', body_text)-2,1), 35) AS body_snip,
                  SUBSTRING(subject, GREATEST(LOCATE('{{specialist', subject)-2,1), 35) AS subj_snip
                FROM notification_templates
                WHERE subject LIKE '%{{specialist%' OR body_text LIKE '%{{specialist%';
              "
