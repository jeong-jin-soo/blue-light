name: One-off - Unify manager to specialist

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-unify-specialist.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Verify token integrity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -N -e "
                SELECT CONCAT('broken_specialist_tokens=', COUNT(*)) FROM notification_templates WHERE subject LIKE '%{{specialist%' OR body_text LIKE '%{{specialist%';
                SELECT CONCAT('rows_with_managerName_token=', COUNT(*)) FROM notification_templates WHERE body_text LIKE '%{{managerName}}%' OR subject LIKE '%{{managerName}}%';
                SELECT CONCAT('concierge rows still saying manager(prose)=', COUNT(*)) FROM notification_templates WHERE template_code IN ('A-31','A-32','A-33','A-34','A-35','A-36','A-37','A-38','A-39','A-40','A-41','A-42','C-01','C-02','C-03','C-04','C-05','C-06','C-07','C-08','C-09','M-03','M-04') AND (LOWER(body_text) LIKE '% manager%' OR LOWER(subject) LIKE '%manager %');
              "
