name: Deploy to Development (DigitalOcean)

# 올인원 단일 dev 드롭릿 배포 (비용축소 통합, 2026-07).
#  - DB = 드롭릿 내 MySQL 컨테이너(로컬). MYSQL_ROOT_PASSWORD는 기존 .env 보존.
#  - sld-agent 제거. TLS는 드롭릿 Caddy(Let's Encrypt, dev.licensekaki.com).
#  - 파일저장은 DO Spaces 유지.
on:
  push:
    branches: [develop]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}   # registry.digitalocean.com/<registry>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: blue-light-backend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('blue-light-backend/**/*.gradle*', 'blue-light-backend/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - run: ./gradlew build --no-daemon -x test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: blue-light-frontend }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blue-light-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env: { VITE_API_BASE_URL: /api }

  docker-push:
    name: Push Docker Images → DOCR
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: development
    steps:
      - uses: actions/checkout@v5
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200
      - name: Build & Push Backend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-backend:latest ./blue-light-backend
          docker push $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-backend:latest
      - name: Build & Push Frontend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-frontend:latest \
                       --build-arg VITE_API_BASE_URL=/api ./blue-light-frontend
          docker push $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-frontend:latest

  deploy:
    name: Deploy to Dev Droplet
    runs-on: ubuntu-latest
    needs: docker-push
    environment: development
    steps:
      - uses: actions/checkout@v5
      - name: Copy compose & Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "deploy/digitalocean/docker-compose.do.yml,deploy/digitalocean/Caddyfile"
          target: "/root/bluelight"
          strip_components: 2     # → docker-compose.do.yml, Caddyfile 만 배치
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/bluelight
            mv -f docker-compose.do.yml docker-compose.yml

            echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com \
              -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin

            # MySQL root 비번은 DB 초기화 시 baked → 기존 .env 값 보존(없으면 신규 생성)
            OLD_ROOT=$(grep '^MYSQL_ROOT_PASSWORD=' .env 2>/dev/null | cut -d= -f2- || true)
            [ -n "$OLD_ROOT" ] || OLD_ROOT=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')

            cat > .env << 'ENVEOF'
            DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
            IMAGE_TAG=${{ github.sha }}
            SPRING_PROFILES_ACTIVE=default
            SQL_INIT_MODE=never
            SITE_ADDRESS=dev.licensekaki.com
            DB_URL=jdbc:mysql://mysql:3306/bluelight?serverTimezone=Asia/Singapore&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FILE_ENCRYPTION_KEY=${{ secrets.FILE_ENCRYPTION_KEY }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            PASSWORD_RESET_BASE_URL=${{ secrets.PASSWORD_RESET_BASE_URL }}
            FILE_STORAGE_TYPE=s3
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_S3_REGION=sgp1
            AWS_S3_ENDPOINT=https://sgp1.digitaloceanspaces.com
            AWS_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_ACCESS_KEY }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
            MAIL_SMTP_ENABLED=true
            ENVEOF
            echo "MYSQL_ROOT_PASSWORD=$OLD_ROOT" >> .env

            docker image prune -a -f --filter "until=24h" || true
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
