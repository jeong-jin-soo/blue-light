name: One-off - Diagnose template encoding

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-diag-encoding.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Inspect encoding (literal chars)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -N -e "
                SELECT CONCAT('mojibake_rows=', COUNT(*)) FROM notification_templates WHERE body_text LIKE '%â€%' OR subject LIKE '%â€%';
                SELECT CONCAT('clean_emdash_rows=', COUNT(*)) FROM notification_templates WHERE body_text LIKE '%—%';
                SELECT CONCAT('A01_hex_near_Singapore=', HEX(SUBSTRING(body_text, GREATEST(LOCATE('Singapore', body_text)-5, 1), 6))) FROM notification_templates WHERE template_code='A-01' AND channel='EMAIL';
                SELECT CONCAT('has_meta_charset=', SUM(body_text LIKE '%charset%')) FROM notification_templates WHERE channel='EMAIL';
              "
