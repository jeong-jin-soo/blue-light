name: One-off - Edit A-31 body

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-read-a31.yml'

jobs:
  edit:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Write A-31 update SQL
        run: |
          cat > a31.sql <<'SQLEOF'
          UPDATE notification_templates SET
            subject = '[LicenseKaki] Concierge specialist request received · #{{publicCode}}',
            body_text = '<!DOCTYPE html><html><body style="font-family:Helvetica,Arial,sans-serif;color:#222;line-height:1.5"><h2 style="font-size:18px">Thank you for choosing Kaki Concierge.</h2><p>Hello {{applicantName}},</p><p>We''ve received your concierge specialist request <strong>#{{publicCode}}</strong>. A specialist will call you within 24 hours to discuss the work and provide a quote.</p><hr style="border:none;border-top:1px solid #ddd;margin:24px 0"><p style="font-size:12px;color:#888">This is an automated message from LicenseKaki. Please do not reply.</p></body></html>'
          WHERE template_code='A-31' AND channel='EMAIL';
          UPDATE notification_templates SET
            subject = 'Concierge specialist request received: #{{publicCode}}',
            body_text = 'A specialist will call within 24 hours. Stand by.'
          WHERE template_code='A-31' AND channel='IN_APP';
          SELECT CONCAT('EMAIL: ', body_text) FROM notification_templates WHERE template_code='A-31' AND channel='EMAIL';
          SELECT CONCAT('INAPP: ', subject, ' || ', body_text) FROM notification_templates WHERE template_code='A-31' AND channel='IN_APP';
          SQLEOF
          wc -l a31.sql
      - name: Copy SQL to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "a31.sql"
          target: "/home/${{ secrets.DEV_SERVER_USER }}/bluelight"
      - name: Apply
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -i -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" \
              < a31.sql
            rm -f a31.sql
