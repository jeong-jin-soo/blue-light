name: Deploy to Production (DigitalOcean)

# 올인원 단일 드롭릿 배포 (비용축소 통합, 2026-07)
#  - 단일 호스트(PROD_SERVER_HOST_1). LB/2대 matrix 제거.
#  - DB = 드롭릿 내 MySQL 컨테이너(로컬). Managed MySQL 미사용.
#    → MYSQL_ROOT_PASSWORD는 DB 초기화 시 baked. 기존 .env 값을 보존(없으면 신규 생성).
#  - sld-agent 제거(WhatsApp 퍼스트 전환). 파일저장은 DO Spaces 유지.
#  - TLS는 드롭릿 Caddy(Let's Encrypt)가 종단.
on:
  push:
    branches: [main]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}   # registry.digitalocean.com/<registry>
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blue-light-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('blue-light-backend/**/*.gradle*', 'blue-light-backend/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build
        run: ./gradlew build --no-daemon -x test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blue-light-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blue-light-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

  docker-push:
    name: Push Docker Images → DOCR
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build & Push Backend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-backend:stable ./blue-light-backend
          docker push $DOCKER_REGISTRY/bluelight-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-backend:stable
      - name: Build & Push Frontend
        run: |
          docker build -t $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/bluelight-frontend:stable \
                       --build-arg VITE_API_BASE_URL=/api ./blue-light-frontend
          docker push $DOCKER_REGISTRY/bluelight-frontend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/bluelight-frontend:stable

  deploy:
    name: Deploy (single droplet)
    runs-on: ubuntu-latest
    needs: docker-push
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST_1 }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy compose & Caddyfile, deploy
        env:
          HOST: ${{ secrets.PROD_SERVER_HOST_1 }}
          USER: ${{ secrets.PROD_SERVER_USER }}
          SSH_OPTS: "-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
        run: |
          scp $SSH_OPTS deploy/digitalocean/docker-compose.do.yml ${USER}@${HOST}:/root/bluelight/docker-compose.yml
          scp $SSH_OPTS deploy/digitalocean/Caddyfile ${USER}@${HOST}:/root/bluelight/Caddyfile

          ssh $SSH_OPTS ${USER}@${HOST} bash -s << 'DEPLOY_SCRIPT'
          set -e
          cd /root/bluelight

          # DOCR 로그인 (DO 토큰을 user/pass 양쪽으로)
          echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com \
            -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin

          # MySQL root 비번은 DB 초기화 시 baked 됨 → 기존 .env 값 보존(없으면 신규 생성)
          OLD_ROOT=$(grep '^MYSQL_ROOT_PASSWORD=' .env 2>/dev/null | cut -d= -f2- || true)
          [ -n "$OLD_ROOT" ] || OLD_ROOT=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')

          cat > .env << 'ENVEOF'
          DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
          IMAGE_TAG=${{ github.sha }}
          SPRING_PROFILES_ACTIVE=prod
          SQL_INIT_MODE=never
          SITE_ADDRESS=licensekaki.com, www.licensekaki.com
          DB_URL=jdbc:mysql://mysql:3306/bluelight?serverTimezone=Asia/Singapore&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FILE_ENCRYPTION_KEY=${{ secrets.FILE_ENCRYPTION_KEY }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          PASSWORD_RESET_BASE_URL=${{ secrets.PASSWORD_RESET_BASE_URL }}
          FILE_STORAGE_TYPE=s3
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION=sgp1
          AWS_S3_ENDPOINT=https://sgp1.digitaloceanspaces.com
          AWS_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}
          MAIL_SMTP_ENABLED=true
          ENVEOF
          echo "MYSQL_ROOT_PASSWORD=$OLD_ROOT" >> .env

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          DEPLOY_SCRIPT

      - name: Health check
        env:
          HOST: ${{ secrets.PROD_SERVER_HOST_1 }}
          USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          for i in $(seq 1 30); do
            RESULT=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              ${USER}@${HOST} "docker exec bluelight-frontend curl -s -o /dev/null -w '%{http_code}' http://localhost/health" 2>/dev/null || echo "000")
            [ "$RESULT" = "200" ] && { echo "✅ healthy"; exit 0; }
            echo "⏳ $i/30 ($RESULT)"; sleep 10
          done
          echo "❌ health check failed"; exit 1
