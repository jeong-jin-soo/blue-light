name: One-off - Clean optional tokens

# 기존 템플릿의 {{var?}} → {{var}} 정규화 (소스 정리 + 값 있으면 정상 렌더).
# 렌더러 안전장치가 이미 노출은 막지만, 소스도 깨끗하게. 실행 후 제거.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-clean-optional-tokens.yml'

jobs:
  clean:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: REGEXP strip optional ? markers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -N -e "
                SELECT CONCAT('before_optional_tokens=', COUNT(*)) FROM notification_templates WHERE body_text REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]' OR subject REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]';
                UPDATE notification_templates SET
                  body_text = REGEXP_REPLACE(body_text, '[{][{]([A-Za-z0-9_.-]+)[?][}][}]', '{{\$1}}'),
                  subject   = REGEXP_REPLACE(subject,   '[{][{]([A-Za-z0-9_.-]+)[?][}][}]', '{{\$1}}')
                WHERE body_text REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]' OR subject REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]';
                SELECT CONCAT('rows=', ROW_COUNT());
                SELECT CONCAT('after_optional_tokens=', COUNT(*)) FROM notification_templates WHERE body_text REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]' OR subject REGEXP '[{][{][A-Za-z0-9_.-]+[?][}][}]';
              "
