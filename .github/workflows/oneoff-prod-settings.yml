name: One-off - Compare settings

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-prod-settings.yml'

jobs:
  cmp:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Compare admin settings dev vs prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            echo "===== system_settings (PROD) ====="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(setting_key,' = ',setting_value) FROM bluelight_prod.system_settings ORDER BY setting_key;"
            echo "===== system_settings (DEV) ====="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(setting_key,' = ',setting_value) FROM bluelight.system_settings ORDER BY setting_key;"
            echo "===== master_prices (PROD) ====="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(description,' | price=',price,' renewal=',renewal_price,' sld=',sld_price,' active=',is_active) FROM bluelight_prod.master_prices ORDER BY kva_min;"
            echo "===== master_prices (DEV) ====="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e \
              "SELECT CONCAT(description,' | price=',price,' renewal=',renewal_price,' sld=',sld_price,' active=',is_active) FROM bluelight.master_prices ORDER BY kva_min;"
            echo "===== 카운트 비교 (prod vs dev) ====="
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql -h "$MYSQL_HOST" -u "$DB_USERNAME" -N -e "
                SELECT CONCAT('doc_type_catalog prod=', (SELECT COUNT(*) FROM bluelight_prod.document_type_catalog), ' dev=', (SELECT COUNT(*) FROM bluelight.document_type_catalog));
                SELECT CONCAT('role_metadata prod=', (SELECT COUNT(*) FROM bluelight_prod.role_metadata), ' dev=', (SELECT COUNT(*) FROM bluelight.role_metadata));
                SELECT CONCAT('document_number_types prod=', (SELECT COUNT(*) FROM bluelight_prod.document_number_types), ' dev=', (SELECT COUNT(*) FROM bluelight.document_number_types));
              "
