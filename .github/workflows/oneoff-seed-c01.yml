name: One-off - Seed C-01 template

# 일회성: 카피북 C-01 카드에 본문 섹션 추가됨 → C-01(EMAIL+IN_APP) 행 시드(enabled=TRUE).
# 매니저 알림(notifySubmitted) 렌더 대상. 실행 후 제거.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/oneoff-seed-c01.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5
      - name: Generate C-01 seed SQL
        run: |
          python3 scripts/import_notification_templates.py 2>/dev/null \
            | grep "VALUES ('C-01'," > c01_seed.sql
          echo "rows: $(wc -l < c01_seed.sql)"
      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "c01_seed.sql"
          target: "/home/${{ secrets.DEV_SERVER_USER }}/bluelight"
      - name: Apply (utf8mb4)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/bluelight
            MYSQL_HOST=$(grep '^MYSQL_HOST=' .env | head -1 | cut -d= -f2-)
            MYSQL_PORT=$(grep '^MYSQL_PORT=' .env | head -1 | cut -d= -f2-)
            MYSQL_DATABASE=$(grep '^MYSQL_DATABASE=' .env | head -1 | cut -d= -f2-)
            DB_USERNAME=$(grep '^DB_USERNAME=' .env | head -1 | cut -d= -f2-)
            DB_PASSWORD=$(grep '^DB_PASSWORD=' .env | head -1 | cut -d= -f2-)
            docker run --rm -i -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" \
              < c01_seed.sql
            docker run --rm -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
              mysql --default-character-set=utf8mb4 -h "$MYSQL_HOST" -P "${MYSQL_PORT:-3306}" -u "$DB_USERNAME" "$MYSQL_DATABASE" -N -e \
              "SELECT CONCAT('C-01 ', channel, ' enabled=', enabled, ' subj=', subject) FROM notification_templates WHERE template_code='C-01';"
            rm -f c01_seed.sql
